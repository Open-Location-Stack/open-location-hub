name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SIGNOZ_REF: v0.117.1
      APT_PACKAGES: just pkg-config libproj-dev proj-data
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Cache Go tool binaries
        uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('Justfile') }}

      - name: Cache SigNoz checkout
        uses: actions/cache@v5
        with:
          path: ~/.cache/open-rtls/signoz/${{ env.SIGNOZ_REF }}
          key: ${{ runner.os }}-signoz-checkout-${{ env.SIGNOZ_REF }}

      - name: Bootstrap tools
        run: just bootstrap

      - name: Generate and check clean git state
        run: |
          just generate
          git diff --exit-code

      - name: Lint
        run: just lint

      - name: Tests
        run: just test

  race:
    runs-on: ubuntu-latest
    env:
      SIGNOZ_REF: v0.117.1
      APT_PACKAGES: just pkg-config libproj-dev proj-data
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Cache Go tool binaries
        uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('Justfile') }}

      - name: Cache SigNoz checkout
        uses: actions/cache@v5
        with:
          path: ~/.cache/open-rtls/signoz/${{ env.SIGNOZ_REF }}
          key: ${{ runner.os }}-signoz-checkout-${{ env.SIGNOZ_REF }}

      - name: Bootstrap tools
        run: just bootstrap

      - name: Race tests
        run: just test-race
