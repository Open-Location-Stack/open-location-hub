# Local overlay for docker-compose.yml. The broker is reachable only inside
# the project's Docker network.
services:
  kafka:
    image: apache/kafka:4.3.0
    environment:
      CLUSTER_ID: bG9jYXRpb24taHViLWRldg
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - shadow-kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.3.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      OBSERVATION_TOPIC: "${KAFKA_SHADOW_TOPIC:-location-hub.observations.v1}"
      OBSERVATION_RETENTION_MS: "${KAFKA_SHADOW_RETENTION_MS:-${KAFKA_LOG_RETENTION_MS:-21600000}}"
      ASSET_INPUT_TOPIC: "${KAFKA_ASSET_INPUT_TOPIC:-location-hub.asset-inputs.v1}"
      ASSET_INPUT_RETENTION_MS: "${KAFKA_ASSET_INPUT_RETENTION_MS:-${KAFKA_LOG_RETENTION_MS:-21600000}}"
      ESTIMATE_TOPIC: "${KAFKA_ESTIMATE_TOPIC:-location-hub.motion-estimates.v1}"
      ESTIMATE_RETENTION_MS: "${KAFKA_ESTIMATE_RETENTION_MS:-${KAFKA_LOG_RETENTION_MS:-21600000}}"
      ESTIMATOR_STATE_TOPIC: "${KAFKA_ESTIMATOR_STATE_TOPIC:-location-hub.estimator-state.v1}"
      CONFIG_TOPIC: "${KAFKA_CONFIG_TOPIC:-location-hub.configuration.v1}"
      CONFIG_RETENTION_MS: "${KAFKA_CONFIG_RETENTION_MS:-${KAFKA_LOG_RETENTION_MS:-21600000}}"
      FENCE_INPUT_TOPIC: "${KAFKA_FENCE_INPUT_TOPIC:-}"
      FENCE_INPUT_RETENTION_MS: "${KAFKA_FENCE_INPUT_RETENTION_MS:-${KAFKA_LOG_RETENTION_MS:-21600000}}"
      FENCE_TRANSITION_TOPIC: "${KAFKA_FENCE_TRANSITION_TOPIC:-location-hub.fence-transitions.v1}"
      FENCE_TRANSITION_RETENTION_MS: "${KAFKA_FENCE_TRANSITION_RETENTION_MS:-${KAFKA_LOG_RETENTION_MS:-21600000}}"
      FENCE_STATE_TOPIC: "${KAFKA_FENCE_STATE_TOPIC:-location-hub.fence-state.v1}"
      COLLISION_CELL_TOPIC: "${KAFKA_COLLISION_CELL_TOPIC:-}"
      COLLISION_CELL_RETENTION_MS: "${KAFKA_COLLISION_CELL_RETENTION_MS:-${KAFKA_LOG_RETENTION_MS:-21600000}}"
      COLLISION_PAIR_TOPIC: "${KAFKA_COLLISION_PAIR_TOPIC:-location-hub.collision-pairs.v1}"
      COLLISION_PAIR_RETENTION_MS: "${KAFKA_COLLISION_PAIR_RETENTION_MS:-${KAFKA_LOG_RETENTION_MS:-21600000}}"
      COLLISION_CELL_STATE_TOPIC: "${KAFKA_COLLISION_CELL_STATE_TOPIC:-location-hub.collision-cell-state.v1}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        create_topic() {
          case "$$2" in
            ""|*[!0-9]*) echo "invalid retention for topic $$1" >&2; exit 2 ;;
          esac
          test "$$2" -gt 0
          segment_ms=300000
          if test "$$2" -lt "$$segment_ms"; then segment_ms="$$2"; fi
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$1" \
            --partitions 12 --replication-factor 1 \
            --config cleanup.policy=delete --config message.timestamp.type=LogAppendTime \
            --config "retention.ms=$$2" --config "segment.ms=$$segment_ms"
        }
        create_checkpoint() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$1" \
            --partitions 12 --replication-factor 1 --config cleanup.policy=compact
        }
        topics=,
        set -- "$$OBSERVATION_TOPIC" "$$ASSET_INPUT_TOPIC" "$$ESTIMATE_TOPIC" "$$ESTIMATOR_STATE_TOPIC" "$$CONFIG_TOPIC"
        if test -n "$$FENCE_INPUT_TOPIC"; then
          set -- "$$@" "$$FENCE_INPUT_TOPIC" "$$FENCE_TRANSITION_TOPIC" "$$FENCE_STATE_TOPIC"
        fi
        if test -n "$$COLLISION_CELL_TOPIC"; then
          set -- "$$@" "$$COLLISION_CELL_TOPIC" "$$COLLISION_PAIR_TOPIC" "$$COLLISION_CELL_STATE_TOPIC"
        fi
        for topic in "$$@"; do
          test -n "$$topic"
          case "$$topics" in
            *,"$$topic",*) echo "reused topic name $$topic" >&2; exit 2 ;;
          esac
          topics="$$topics$$topic,"
        done
        create_topic "$$OBSERVATION_TOPIC" "$$OBSERVATION_RETENTION_MS"
        create_topic "$$ASSET_INPUT_TOPIC" "$$ASSET_INPUT_RETENTION_MS"
        create_topic "$$ESTIMATE_TOPIC" "$$ESTIMATE_RETENTION_MS"
        create_topic "$$CONFIG_TOPIC" "$$CONFIG_RETENTION_MS"
        if test -n "$$FENCE_INPUT_TOPIC"; then
          create_topic "$$FENCE_INPUT_TOPIC" "$$FENCE_INPUT_RETENTION_MS"
          create_topic "$$FENCE_TRANSITION_TOPIC" "$$FENCE_TRANSITION_RETENTION_MS"
          create_checkpoint "$$FENCE_STATE_TOPIC"
        fi
        if test -n "$$COLLISION_CELL_TOPIC"; then
          create_topic "$$COLLISION_CELL_TOPIC" "$$COLLISION_CELL_RETENTION_MS"
          create_topic "$$COLLISION_PAIR_TOPIC" "$$COLLISION_PAIR_RETENTION_MS"
          create_checkpoint "$$COLLISION_CELL_STATE_TOPIC"
        fi
        create_checkpoint "$$ESTIMATOR_STATE_TOPIC"

  app:
    environment:
      KAFKA_SHADOW_BROKERS: kafka:9092
      KAFKA_SHADOW_INSECURE_LOCAL: "true"
      KAFKA_SHADOW_TOPIC: "${KAFKA_SHADOW_TOPIC:-location-hub.observations.v1}"
      KAFKA_ASSET_INPUT_TOPIC: "${KAFKA_ASSET_INPUT_TOPIC:-location-hub.asset-inputs.v1}"
      KAFKA_ESTIMATE_TOPIC: "${KAFKA_ESTIMATE_TOPIC:-location-hub.motion-estimates.v1}"
      KAFKA_ESTIMATOR_STATE_TOPIC: "${KAFKA_ESTIMATOR_STATE_TOPIC:-location-hub.estimator-state.v1}"
      KAFKA_CONFIG_TOPIC: "${KAFKA_CONFIG_TOPIC:-location-hub.configuration.v1}"
      KAFKA_FENCE_INPUT_TOPIC: "${KAFKA_FENCE_INPUT_TOPIC:-}"
      KAFKA_FENCE_TRANSITION_TOPIC: "${KAFKA_FENCE_TRANSITION_TOPIC:-location-hub.fence-transitions.v1}"
      KAFKA_FENCE_STATE_TOPIC: "${KAFKA_FENCE_STATE_TOPIC:-location-hub.fence-state.v1}"
      KAFKA_COLLISION_CELL_TOPIC: "${KAFKA_COLLISION_CELL_TOPIC:-}"
      KAFKA_COLLISION_PAIR_TOPIC: "${KAFKA_COLLISION_PAIR_TOPIC:-location-hub.collision-pairs.v1}"
      KAFKA_COLLISION_CELL_STATE_TOPIC: "${KAFKA_COLLISION_CELL_STATE_TOPIC:-location-hub.collision-cell-state.v1}"
      HUB_CONFIG_HISTORY: "${HUB_CONFIG_HISTORY:-6h}"
      HUB_CONFIG_READ_URL: "${HUB_CONFIG_READ_URL:-}"
      HUB_CONFIG_MAX_STALE: "${HUB_CONFIG_MAX_STALE:-30s}"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

volumes:
  shadow-kafka:
