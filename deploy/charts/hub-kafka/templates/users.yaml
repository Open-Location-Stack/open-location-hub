{{- define "hubKafka.acl" -}}
- resource:
    type: {{ .type }}
    {{- with .name }}
    name: {{ . | quote }}
    patternType: {{ $.pattern | default "literal" }}
    {{- end }}
  operations: {{ toJson .ops }}
{{- end -}}

{{- $root := . -}}
{{- $t := .Values.kafka.topics -}}
{{- $routerGroup := .Values.kafka.routerGroup -}}
{{- $estimateGroup := printf "%s.estimator" $t.estimatorState -}}
{{- $topicRead := list "Read" "Describe" -}}
{{- $topicWrite := list "Write" "Describe" -}}
{{- $groupRead := list "Read" "Describe" -}}
{{- $txnWrite := list "Write" "Describe" -}}
{{- $users := dict
  "api" (list
    (dict "type" "topic" "name" $t.observations "ops" $topicWrite)
    (dict "type" "cluster" "ops" (list "IdempotentWrite")))
  "asset-router" (list
    (dict "type" "topic" "name" $t.observations "ops" $topicRead)
    (dict "type" "topic" "name" $t.assetInputs "ops" $topicWrite)
    (dict "type" "group" "name" $routerGroup "ops" $groupRead)
    (dict "type" "transactionalId" "name" (printf "%s." $routerGroup) "pattern" "prefix" "ops" $txnWrite))
  "asset-estimator" (list
    (dict "type" "topic" "name" $t.assetInputs "ops" $topicRead)
    (dict "type" "topic" "name" $t.configuration "ops" $topicRead)
    (dict "type" "topic" "name" $t.estimates "ops" $topicWrite)
    (dict "type" "topic" "name" $t.estimatorState "ops" (list "Read" "Write" "Describe" "DescribeConfigs"))
    (dict "type" "cluster" "ops" (list "IdempotentWrite"))
    (dict "type" "group" "name" $estimateGroup "ops" $groupRead)
    (dict "type" "transactionalId" "name" (printf "%s." $estimateGroup) "pattern" "prefix" "ops" $txnWrite))
  "config-relay" (list
    (dict "type" "topic" "name" $t.configuration "ops" $topicWrite)
    (dict "type" "transactionalId" "name" "location-hub.config-relay." "pattern" "prefix" "ops" $txnWrite))
-}}
{{- range $role, $acls := $users }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ $root.Release.Name }}-{{ $role }}
  labels:
    strimzi.io/cluster: {{ $root.Release.Name }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      {{- range $acls }}
      {{- include "hubKafka.acl" . | nindent 6 }}
      {{- end }}
{{- end }}
