apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-health-check
  labels:
    {{- include "hub.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: smoke-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 60
  securityContext:
    {{- include "hub.podSecurity" . | nindent 4 }}
  containers:
    - name: health-check
      image: alpine:3.24.2
      command: ["wget", "-qO-", {{ printf "http://%s:8080/healthz" .Release.Name | quote }}]
      securityContext:
        {{- include "hub.containerSecurity" . | nindent 8 }}
      resources:
        requests: {cpu: 10m, memory: 8Mi}
        limits: {memory: 32Mi}
