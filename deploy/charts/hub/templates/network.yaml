{{- if .Values.network.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-isolated
spec:
  podSelector:
    matchLabels:
      {{- include "hub.commonLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- with .Values.network.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- with .Values.network.httpIngressPeers }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-http
spec:
  podSelector:
    matchLabels:
      {{- include "hub.commonLabels" $ | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - {port: 8080, protocol: TCP}
{{- end }}
{{- end }}
{{- if .Values.network.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-smoke-egress
spec:
  podSelector:
    matchLabels:
      {{- include "hub.commonLabels" . | nindent 6 }}
      app.kubernetes.io/component: smoke-test
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "hub.commonLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports: [{port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-smoke-ingress
spec:
  podSelector:
    matchLabels:
      {{- include "hub.commonLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "hub.commonLabels" . | nindent 14 }}
              app.kubernetes.io/component: smoke-test
      ports: [{port: 8080}]
{{- end }}
