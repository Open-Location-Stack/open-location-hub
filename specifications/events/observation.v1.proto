syntax = "proto3";

package locationhub.stream.v1;

option go_package = "github.com/formation-res/open-location-hub/internal/stream/pb;streampb";

// Observation is the internal ingress envelope. The payload uses the matching
// OMLOX Location or Proximity JSON schema. Envelope fields evolve additively.
message Observation {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_LOCATION = 1;
    KIND_PROXIMITY = 2;
  }

  uint32 schema_version = 1;
  bytes event_id = 2;
  string origin_hub_id = 3;
  string provider_id = 4;
  string source = 5;
  Kind kind = 6;
  optional int64 observed_at_unix_nano = 7;
  int64 received_at_unix_nano = 8;
  string transport = 9;
  bytes payload_json = 10;
  repeated string resolved_trackable_ids = 11;
  bytes resolved_proximity_location_json = 12;
}

// AssetInput is an observation addressed to exactly one trackable. Kafka keys
// these records by origin hub and trackable, independently of provider/source.
message AssetInput {
  uint32 schema_version = 1;
  bytes event_id = 2;
  string trackable_id = 3;
  Observation observation = 4;
}

// MotionEstimate is the current and previous position for one asset decision.
// The location is an OMLOX Location object with horizontal speed and course.
message MotionEstimate {
  uint32 schema_version = 1;
  bytes event_id = 2;
  bytes input_event_id = 3;
  string origin_hub_id = 4;
  string trackable_id = 5;
  uint64 sequence = 6;
  bytes location_json = 7;
  repeated double previous_position = 8;
  repeated double horizontal_velocity_meters_per_second = 9;
  double horizontal_accuracy_meters = 10;
  bool filter_reset = 11;
  optional int64 configuration_revision = 12;
  bytes trigger_asset_input_id = 13;
}

// EstimateCheckpoint is current state materialized by asset. Its compact-only
// topic is co-partitioned with the asset input topic. The last record per key
// survives expiry of the event topics.
message EstimateCheckpoint {
  message Axis {
    double position = 1;
    double velocity = 2;
    double position_variance = 3;
    double covariance = 4;
    double velocity_variance = 5;
  }

  uint32 schema_version = 1;
  uint64 sequence = 2;
  int64 observed_at_unix_nano = 3;
  bytes frame = 4;
  repeated Axis axes = 5;
  repeated double position = 6;
  repeated AssetInput candidates = 7;
  bytes selected_input_id = 8;
  int64 evaluated_at_unix_nano = 9;
  FenceRoutingCheckpoint fence_routing = 10;
}

// EstimatorFrontier binds a partition's materialized state to the exact input
// generation and next offset committed with it.
message EstimatorFrontier {
  bytes input_topic_id = 1;
  int64 next_offset = 2;
  bool configuration_aware = 3;
  int64 configuration_revision = 4;
  bool fence_routing = 5;
  bytes fence_input_topic_id = 6;
  int32 fence_input_partitions = 7;
}

// FenceRoutingCheckpoint retains possible memberships across cell jumps and
// replica reassignment. Safe expiry is measured in the input processing clock.
message FenceRoutingCheckpoint {
  message Interest {
    string fence_id = 1;
    optional int64 certainly_expired_at_unix_nano = 2;
  }
  int64 processed_at_unix_nano = 1;
  int64 configuration_revision = 2;
  repeated Interest interests = 3;
}

// FenceEvaluation is keyed by the origin, fence and trackable. Candidates for
// one asset are produced in estimate sequence, including departed coverage.
message FenceEvaluation {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_EVALUATE = 1;
    ACTION_CANCEL = 2;
    ACTION_DEADLINE = 3;
  }
  uint32 schema_version = 1;
  bytes event_id = 2;
  bytes estimate_id = 3;
  string origin_hub_id = 4;
  string fence_id = 5;
  string trackable_id = 6;
  uint64 asset_sequence = 7;
  int64 configuration_revision = 8;
  uint32 topology_version = 9;
  int64 processed_at_unix_nano = 10;
  bytes location_json = 11;
  bytes fence_json = 12;
  double trackable_radius = 13;
  optional double trackable_extrusion = 14;
  double exit_tolerance = 15;
  int64 fence_timeout_nanos = 16;
  int64 tolerance_timeout_nanos = 17;
  int64 exit_delay_nanos = 18;
  Action action = 19;
  bytes deadline_generation = 20;
}

// FenceMembershipCheckpoint materializes one active membership and its timers.
message FenceMembershipCheckpoint {
  FenceEvaluation observation = 1;
  int64 entered_at_unix_nano = 2;
  uint32 physical_area = 3;
  int64 fence_deadline_unix_nano = 4;
  int64 tolerance_deadline_unix_nano = 5;
  int64 outside_deadline_unix_nano = 6;
}

// FenceTransition is an ordered entry or exit for a fence membership.
message FenceTransition {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ENTRY = 1;
    KIND_EXIT = 2;
  }
  uint32 schema_version = 1;
  bytes event_id = 2;
  bytes cause_id = 3;
  Kind kind = 4;
  FenceEvaluation observation = 5;
  int64 entered_at_unix_nano = 6;
  int64 occurred_at_unix_nano = 7;
}

// FenceMembershipFrontier binds compacted state to one input and output generation.
message FenceMembershipFrontier {
  bytes input_topic_id = 1;
  int64 next_offset = 2;
  bytes transition_topic_id = 3;
  uint32 topology_version = 4;
}

// ConfigurationRevision represents one committed single-hub database
// transaction. A snapshot at this revision already includes these changes.
message ConfigurationRevision {
  message Change {
    string resource_kind = 1;
    string operation = 2;
    bytes previous_json = 3;
    bytes current_json = 4;
  }

  uint32 schema_version = 1;
  string origin_hub_id = 2;
  int64 revision = 3;
  int64 recorded_at_unix_nano = 4;
  repeated Change changes = 5;
}

// ConfigurationRevisionPart carries a bounded fragment of a serialized bundle.
// All fragments are published in one Kafka transaction and share the hub key.
message ConfigurationRevisionPart {
  uint32 schema_version = 1;
  string origin_hub_id = 2;
  int64 revision = 3;
  uint32 part_index = 4;
  uint32 part_count = 5;
  bytes bundle_sha256 = 6;
  bytes payload = 7;
}
