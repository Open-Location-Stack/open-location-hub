name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OAPI_CODEGEN_VERSION: v2.7.0
      SQLC_VERSION: v1.31.1
      GOOSE_VERSION: v3.27.1
      STATICCHECK_VERSION: v0.7.0
      GOVULNCHECK_VERSION: v1.3.0
      SIGNOZ_REF: v0.117.1
      APT_PACKAGES: just pkg-config libproj-dev proj-data
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go toolchain
        run: |
          expected="$(awk '/^toolchain / { print $2; found=1; exit } /^go / && !found { print "go"$2; exit }' go.mod)"
          actual="$(go env GOVERSION)"
          test "$actual" = "$expected"
          go version

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Cache Go tool binaries
        uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ env.OAPI_CODEGEN_VERSION }}-${{ env.SQLC_VERSION }}-${{ env.GOOSE_VERSION }}-${{ env.STATICCHECK_VERSION }}-${{ env.GOVULNCHECK_VERSION }}

      - name: Cache SigNoz checkout
        uses: actions/cache@v5
        with:
          path: ~/.cache/open-rtls/signoz/${{ env.SIGNOZ_REF }}
          key: ${{ runner.os }}-signoz-checkout-${{ env.SIGNOZ_REF }}

      - name: Bootstrap tools
        run: just bootstrap

      - name: Generate and check clean git state
        run: |
          just generate
          git diff --exit-code

      - name: Lint
        run: just lint

      - name: Tests
        run: just test

  race:
    runs-on: ubuntu-latest
    env:
      OAPI_CODEGEN_VERSION: v2.7.0
      SQLC_VERSION: v1.31.1
      GOOSE_VERSION: v3.27.1
      STATICCHECK_VERSION: v0.7.0
      GOVULNCHECK_VERSION: v1.3.0
      SIGNOZ_REF: v0.117.1
      APT_PACKAGES: just pkg-config libproj-dev proj-data
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go toolchain
        run: |
          expected="$(awk '/^toolchain / { print $2; found=1; exit } /^go / && !found { print "go"$2; exit }' go.mod)"
          actual="$(go env GOVERSION)"
          test "$actual" = "$expected"
          go version

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Cache Go tool binaries
        uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ env.OAPI_CODEGEN_VERSION }}-${{ env.SQLC_VERSION }}-${{ env.GOOSE_VERSION }}-${{ env.STATICCHECK_VERSION }}-${{ env.GOVULNCHECK_VERSION }}

      - name: Cache SigNoz checkout
        uses: actions/cache@v5
        with:
          path: ~/.cache/open-rtls/signoz/${{ env.SIGNOZ_REF }}
          key: ${{ runner.os }}-signoz-checkout-${{ env.SIGNOZ_REF }}

      - name: Bootstrap tools
        run: just bootstrap

      - name: Race tests
        run: just test-race
