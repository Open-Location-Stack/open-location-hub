name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APT_PACKAGES: just pkg-config libproj-dev proj-data
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Cache Go tool binaries
        uses: actions/cache@v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-${{ runner.arch }}-go-tools-${{ hashFiles('justfile', 'go.mod') }}

      - name: Bootstrap tools
        run: just bootstrap

      - name: Generate and check clean git state
        run: |
          just generate
          git diff --exit-code

      - name: Lint
        run: just lint

      - name: Build
        run: just build

      - name: Tests
        run: just test

  race:
    runs-on: ubuntu-latest
    env:
      APT_PACKAGES: just pkg-config libproj-dev proj-data
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Cache Go tool binaries
        uses: actions/cache@v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-${{ runner.arch }}-go-tools-${{ hashFiles('justfile', 'go.mod') }}

      - name: Bootstrap tools
        run: just bootstrap

      - name: Race tests
        run: just test-race

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends just

      - name: Check Python dependencies and connectors
        run: just check-python
